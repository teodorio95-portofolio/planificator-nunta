# Every PR: type-check, unit tests and a production build. Every push to main or a v* tag: the same,
# then the container image for amd64 and arm64 (a VPS, a Raspberry Pi, an Apple silicon Mac) on GHCR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Every PR too: the image starts on a root-owned /data (as a platform disk or a Linux bind mount
  # gives it), seeds the demo, answers /health and the sign-in page, and writes its database.
  smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: planificator-nunta:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container
        run: |
          sudo mkdir -p /tmp/nunta-data && sudo chown root:root /tmp/nunta-data
          docker run -d --name smoke -p 3000:3000 -v /tmp/nunta-data:/data \
            -e ADMIN_PASSWORD=smoke-test-password -e DEMO_DATA=true planificator-nunta:smoke
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs http://localhost:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = 200
          docker exec smoke grep -E '^Uid:\s+1000\s' /proc/1/status
          sudo test -s /tmp/nunta-data/nunta.db
          docker logs smoke | tee /dev/stderr | grep -q 'demo: seeded'
      - if: failure()
        run: docker logs smoke || true

  image:
    needs: [check, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
